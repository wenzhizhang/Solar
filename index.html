<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系模拟器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; }
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.8); font-size: 20px; z-index: 999;
            transition: opacity 0.8s; pointer-events: none;
            text-align: center; line-height: 1.6;
        }
        #loading .spinner {
            width: 40px; height: 40px; margin: 0 auto 16px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ffaa00; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #loading .hint { font-size: 13px; opacity: 0.5; margin-top: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading.hidden { opacity: 0; }
        #loading.error { color: #ff6644; }
        #loading.error .spinner { border-top-color: #ff6644; animation: none; }
        #loading .detail { font-size: 13px; margin-top: 12px; word-break: break-all; max-width: 500px; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <span>加载太阳系</span>
        <div class="hint">正在加载 Three.js ...</div>
    </div>

    <script>
    if (location.protocol === 'file:') {
        document.getElementById('loading').className = 'error';
        document.getElementById('loading').innerHTML =
            '<div style="font-size:40px;margin-bottom:12px;">⚠️</div>' +
            '请通过本地服务器运行' +
            '<div class="hint" style="opacity:0.7;">' +
            '终端执行: <code style="background:rgba(255,255,255,0.1);padding:4px 8px;border-radius:4px;">python3 -m http.server 8080</code>' +
            '<br>然后打开 <code style="background:rgba(255,255,255,0.1);padding:4px 8px;border-radius:4px;">http://localhost:8080</code>' +
            '</div>';
    }
    </script>

    <script type="module">
    try {
        await import('./js/main.js');
        document.querySelector('#loading .hint').textContent = '正在加载纹理 ...';
    } catch (e) {
        var el = document.getElementById('loading');
        el.className = 'error';
        el.innerHTML =
            '<div style="font-size:36px;margin-bottom:8px;">❌</div>' +
            '加载失败' +
            '<div class="detail">' + e.message + '</div>' +
            '<div class="hint">' +
            '尝试: <code style="background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:3px;">python3 -m http.server 8080</code>' +
            '</div>';
        console.error(e);
    }
    </script>
</body>
</html>
